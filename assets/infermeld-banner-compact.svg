<svg xmlns="http://www.w3.org/2000/svg" width="350" height="392" viewBox="0 0 350 392" role="img" aria-labelledby="title desc" data-banner="compact">
  <title id="title">Infermeld. Different silicon. One model.</title>
  <desc id="desc">AMD Vulkan and NVIDIA CUDA grouped around one local GGUF, powered by separately built llama.cpp. A conceptual grouping, not a timing diagram. Device memory remains separate.</desc>
  <rect width="350" height="392" fill="#101513"/>
  <g data-block="brand" transform="translate(25.000 24.000)" font-family="Arial,Helvetica,sans-serif">
      <g fill="none" stroke-width="2.6" transform="scale(.64) translate(-65 -63)">
        <path d="M65 63h30v30H65V63Zm15 15h30v30H80V78Z" stroke="#a6ecc1"/>
        <path d="M95 63h15v15M65 93v15h15" stroke="#ef917c"/>
      </g>
      <text x="41" y="25" fill="#f0f2e8" font-size="27" font-weight="700" letter-spacing="-1">infermeld</text>
    </g>
  <g data-block="copy" transform="translate(175.000 80.000)" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
          <text x="0" y="34" fill="#f0f2e8" font-size="34" font-weight="700" letter-spacing="-1">Different silicon.</text>
          <text x="0" y="73" fill="#a6ecc1" font-size="34" font-weight="700" letter-spacing="-1">One model.</text>
          <text x="0" y="105" fill="#becbc2" font-size="14">AMD + NVIDIA inference.</text>
          <text x="0" y="127" fill="#becbc2" font-size="14">Powered by llama.cpp.</text>
        </g>
  <g data-block="devices" transform="translate(25.000 233.000)" font-family="Arial,Helvetica,sans-serif">
          <text x="150" y="14" text-anchor="middle" fill="#becbc2" font-size="14">One local GGUF</text>
          <g data-card="amd"><rect x="0" y="26" width="142" height="68" rx="3" fill="#1c211e" stroke="#ef917c"/>
            <text x="71" y="54" text-anchor="middle" fill="#ef917c" font-size="18" font-weight="700">AMD</text>
            <text x="71" y="78" text-anchor="middle" fill="#becbc2" font-size="13">Vulkan backend</text></g>
          <g data-card="nvidia"><rect x="158" y="26" width="142" height="68" rx="3" fill="#1c211e" stroke="#a6ecc1"/>
            <text x="229" y="54" text-anchor="middle" fill="#a6ecc1" font-size="18" font-weight="700">NVIDIA</text>
            <text x="229" y="78" text-anchor="middle" fill="#becbc2" font-size="13">CUDA backend</text></g>
          <path d="M0 102v8h300v-8" fill="none" stroke="#32413a" stroke-width="1.5"/>
          <text x="150" y="132" text-anchor="middle" fill="#becbc2" font-size="12">Separate device memory.</text>
        </g>
</svg>
