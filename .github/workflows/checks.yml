name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check source and evidence contracts
        run: make test
      - name: Check patch whitespace
        run: git diff --check
      - name: Build and verify the source-only bundle
        run: |
          make package
          mkdir unpacked
          tar -xzf dist/infermeld-source.tar.gz -C unpacked
          cd unpacked/infermeld
          python3 tools/package.py --verify-manifest SOURCE-MANIFEST.json
          make test
